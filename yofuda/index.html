<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>夜札</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: a night table seen from above. Opponent's traps and beasts on top, yours below, hand along the bottom, a guide line that always says what to do next. Single dark look by choice. */
:root{
  --night:#0F1118; --table:#171A25; --rim:#2B3043; --ink:#ECEAE2; --mute:#9095A6;
  --washi:#EDEAE1; --sumi:#1B1C20; --fire:#E0603F; --water:#4386D6; --wind:#4FA86F; --gold:#D4AF52; --bad:#F06A50; --trap:#B0507E;
  --f-card:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --cw:min(25vw,92px);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto;padding-block:12px 40px;display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--f-card);font-weight:800;font-size:34px;letter-spacing:.2em;margin:0;line-height:1.1}
.sub{color:var(--mute);font-size:13px;margin:4px 0 0}
.panel{background:var(--table);border:1px solid var(--rim);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-card);font-size:19px;margin:0}
.hint{font-size:13px;color:var(--mute);margin:0}
label{font-size:12px;color:var(--mute);letter-spacing:.06em}
input[type=text]{font:inherit;color:var(--ink);background:var(--night);border:1px solid var(--rim);border-radius:6px;padding:10px 12px;width:100%;box-sizing:border-box}
button{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:var(--sumi);padding:12px 16px;cursor:pointer;touch-action:manipulation}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rim)}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,.zone:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>button{flex:1 1 auto}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--night);color:var(--ink);border:1px solid var(--rim);font-family:var(--f-card);font-size:17px;padding:12px}
.side small{display:block;font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--mute)}
.side[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}

/* table */
.stage{display:flex;flex-direction:column;gap:8px;position:relative}
.bar{display:flex;align-items:center;gap:10px;font-size:12px}
.who{font-family:var(--f-card);font-size:16px;flex:1;min-width:0}
.lp{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;font-weight:700}
.lp .num{font-size:24px;letter-spacing:.03em}
.lp small{font-size:11px;color:var(--mute);font-weight:400}
.lp.low .num{color:var(--bad)}
.meta{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.field{background:var(--table);border:1px solid var(--rim);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;gap:10px;position:relative}
.mrow{display:grid;grid-template-columns:repeat(3,var(--cw));justify-content:center;gap:10px}
.trow{display:flex;justify-content:center;gap:26px}
.mid{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);padding:2px 4px}
.mid::before,.mid::after{content:"";flex:1;height:1px;background:var(--rim)}
.mid b{color:var(--ink);font-family:var(--f-card);font-size:14px}
.zone{position:relative;flex:0 0 auto;width:var(--cw);height:calc(var(--cw)*1.4);border:1px dashed var(--rim);border-radius:8px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#3A4057;font-size:11px;transition:transform .15s}
.zone.t{width:calc(var(--cw)*.6);height:calc(var(--cw)*.6*1.4);border-radius:6px}
.zone.h{border:0}
.zone>.card,.zone>.back{position:absolute;inset:0}
.tag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;z-index:3;pointer-events:none}
.tag.top{top:-11px}.tag.bot{bottom:-11px}
.tag.win{background:var(--wind);color:#fff}.tag.lose{background:var(--bad);color:#fff}.tag.even{background:var(--mute);color:#fff}
.tag.done{background:var(--rim);color:var(--ink)}
.tag.go{background:var(--gold);color:var(--sumi)}

/* cards */
.card{--c:var(--gold);width:var(--cw);height:calc(var(--cw)*1.4);border-radius:8px;background:var(--washi);color:var(--sumi);
  border:3px solid var(--c);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;padding:5px 4px 4px;gap:1px;font-family:var(--f-card);text-align:center}
.card.fire{--c:var(--fire)} .card.water{--c:var(--water)} .card.wind{--c:var(--wind)}
.card.spell{--c:var(--gold);background:#E8E0C8} .card.trap{--c:var(--trap);background:#E9DCE3}
.card .nm{font-size:calc(var(--cw)*.115);font-weight:800;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.card .gl{font-size:calc(var(--cw)*.42);line-height:1;font-weight:800;color:var(--c);flex:1;display:flex;align-items:center}
.card .ft{display:flex;justify-content:space-between;align-items:center;width:100%;font-family:var(--f-body);font-size:calc(var(--cw)*.12);font-weight:700;font-variant-numeric:tabular-nums}
.card .at{background:var(--c);color:#fff;border-radius:3px;padding:0 4px}
.card .st{position:absolute;top:-7px;right:-5px;background:var(--sumi);color:var(--gold);border:1px solid var(--gold);border-radius:999px;font-size:10px;padding:0 5px;font-family:var(--f-body)}
.card.boost .ft span:last-child{color:#9A6E00}
.card .rr,.rr{position:absolute;top:-8px;left:-6px;font-family:var(--f-body);font-size:10px;font-weight:800;padding:0 5px;border-radius:4px;letter-spacing:.04em;z-index:2}
.r-R{background:#6C7A8C;color:#fff}.r-SR{background:var(--gold);color:var(--sumi)}.r-UR{background:linear-gradient(90deg,var(--fire),var(--gold),var(--wind),var(--water));color:#fff;text-shadow:0 1px 0 #0006}
.card .abx{position:absolute;bottom:calc(var(--cw)*.2);right:3px;font-family:var(--f-body);font-size:calc(var(--cw)*.1);font-weight:800;background:var(--sumi);color:var(--gold);border-radius:3px;padding:0 3px;letter-spacing:.05em}
.card.rare-SR{box-shadow:0 0 0 1px var(--gold),0 0 10px rgba(212,175,82,.45)}
.card.rare-UR{animation:ur 2.4s linear infinite}
@keyframes ur{0%{box-shadow:0 0 12px 2px var(--fire)}33%{box-shadow:0 0 12px 2px var(--wind)}66%{box-shadow:0 0 12px 2px var(--water)}100%{box-shadow:0 0 12px 2px var(--fire)}}
.abt{display:inline-block;background:var(--sumi);color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 5px;font-size:12px;margin-top:2px}
.card.used{filter:saturate(.35) brightness(.75)}
.back{border-radius:6px;border:2px solid var(--trap);background:repeating-linear-gradient(45deg,#2A1E2E 0 6px,#33243A 6px 12px);display:flex;align-items:center;justify-content:center;font-family:var(--f-card);color:var(--trap);font-weight:800;font-size:calc(var(--cw)*.26)}
.mine-set{position:absolute;left:50%;transform:translateX(-50%);bottom:-16px;background:var(--trap);color:#fff!important;border-radius:999px;padding:0 6px;text-align:center;font-size:9px;color:var(--trap);font-weight:700;white-space:nowrap}

/* what you can touch glows */
.tap{cursor:pointer}
.can{cursor:pointer}
.can::after{content:"";position:absolute;inset:-5px;border-radius:11px;border:2px solid var(--gold);animation:pulse 1.4s ease-in-out infinite;pointer-events:none}
.target{cursor:pointer}
.target::after{content:"";position:absolute;inset:-5px;border-radius:11px;border:3px solid var(--bad);animation:pulse .8s ease-in-out infinite;pointer-events:none}
.can.tc::after{border-color:var(--trap)}
.can.tc.picked::after{box-shadow:0 0 18px var(--trap)}
.zone.t.can{border:2px dashed var(--trap);color:var(--trap);font-weight:700}
.zone.t.empty{color:#4A3A52;font-size:10px}
.picked{transform:translateY(-8px)}
.picked::after{animation:none;border-width:3px;opacity:1;box-shadow:0 0 18px var(--gold)}
.off{opacity:.42}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.hand{display:flex;gap:8px;overflow-x:auto;padding:16px 6px 10px;scrollbar-width:thin;min-height:calc(var(--cw)*1.4)}
.guide{background:var(--gold);color:var(--sumi);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.guide.wait{background:var(--rim);color:var(--ink)}
.guide.end{background:var(--ink)}
.guide .n{font-family:var(--f-card);font-size:20px;line-height:1;background:var(--sumi);color:var(--gold);border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sheet{display:flex;gap:14px;align-items:flex-start}
.sheet .card{--cw:84px;flex:0 0 auto;position:relative}
.sheet .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sheet .tx b{font-family:var(--f-card);font-size:18px}
.why{color:var(--bad);font-size:13px}
.res{font-family:var(--f-card);font-size:30px;font-weight:800;margin:0}
.peer{font-size:12px;color:var(--mute);margin:0;flex:1;min-width:0} .peer.ok{color:var(--wind)} .peer.bad{color:var(--bad)}
.evlog{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:5px}
.evlog li{padding-left:10px;border-left:2px solid var(--rim)}
.evlog li.h{border-color:var(--gold);color:var(--gold);font-weight:700}
.evlog li.b{border-color:var(--ink);font-weight:700}
.evlog li.d{border-color:var(--bad);color:var(--bad)}
.evlog li.tr{border-color:var(--trap);color:#E7A6C8}
.why2{font-size:15px;line-height:1.7}
.dk-h{font-family:var(--f-card);font-size:16px;margin:4px 0 0}
.dk-grid{display:flex;flex-wrap:wrap;gap:16px 10px;padding-top:10px}
.dk{cursor:pointer;--cw:min(22vw,80px)}
.dk .card{--cw:min(22vw,80px)}
.dk.out .card{opacity:.4;filter:saturate(.4)}
.dk.in::after{content:"";position:absolute;inset:-4px;border-radius:10px;border:2px solid var(--gold);pointer-events:none}
.count{font-size:20px;font-variant-numeric:tabular-nums}
.qopts{display:grid;grid-template-columns:1fr;gap:10px}
.qo{padding:14px 14px;font-size:15px;line-height:1.5;text-align:left;font-weight:400}
.qo.ng{border-color:var(--bad);color:var(--bad)}
.qprog{height:8px;border-radius:999px;background:var(--rim);overflow:hidden}
.qprog>div{height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.cover{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.cv-big{font-family:var(--f-card);font-size:30px;font-weight:800;line-height:1.4;margin:0}
.panel.hl{border-color:var(--gold)}
details summary{cursor:pointer;font-size:14px;font-family:var(--f-card)}
.rules{font-size:13px;margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.banner{position:fixed;left:0;right:0;top:38%;z-index:50;pointer-events:none;text-align:center;padding:18px 16px;
  background:linear-gradient(90deg,transparent,rgba(10,10,16,.93) 12%,rgba(10,10,16,.93) 88%,transparent);border-block:2px solid var(--bc,var(--gold))}
.banner .m{font-family:var(--f-card);font-weight:800;font-size:clamp(24px,8vw,48px);letter-spacing:.14em;color:var(--bc,var(--gold));line-height:1.15;text-shadow:0 0 24px var(--bc,var(--gold))}
.banner .s{font-size:14px;color:var(--ink);margin-top:6px;white-space:pre-line;line-height:1.7}
.float{position:fixed;z-index:55;pointer-events:none;font-family:var(--f-card);font-weight:800;font-size:40px;transform:translate(-50%,-50%);text-shadow:0 2px 0 #000,0 0 18px currentColor;white-space:nowrap}
.flash{position:fixed;inset:0;z-index:45;pointer-events:none}
@media (prefers-reduced-motion:reduce){.can::after,.target::after{animation:none;opacity:.8}.card.rare-UR{animation:none}}
</style>

<div class="wrap">
  <header id="hdr">
    <h1>夜札</h1>
    <p class="sub">自分の作品を場に出し、言葉と罠をしかけ、相手の命を 0 にする札遊び。</p>
  </header>
  <main id="app"></main>
</div>
<canvas id="fx"></canvas>
<div id="cover" class="cover" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
/* ================= cards ================= */
const ATTR={fire:"炎",water:"水",wind:"風"};
const BEATS={water:"fire",fire:"wind",wind:"water"};
const CARDS=[
 {n:"電柱の詩路",g:"詩",t:"m",a:"fire",atk:1000,f:"街の電柱に、手書きの詩をかかげる企画。"},
 {n:"大蛙美術館",g:"蛙",t:"m",a:"fire",atk:1300,f:"樹冠ごとに作家を分けて展示する、バーチャル美術館。"},
 {n:"膿む映画館",g:"膿",t:"m",a:"fire",atk:1600,f:"句集「キャラメルポップコーンは膿む」から設計した建築。"},
 {n:"コロッセオの塔",g:"闘",t:"m",a:"fire",atk:2300,star:1,f:"コロッセオを大枠にしたスタジアムの上に、自作スケッチの塔を建てる。"},
 {n:"少し外に出られる家",g:"外",t:"m",a:"water",atk:1000,f:"どこからでも「少し」外に出られる平屋。"},
 {n:"二つの器の家",g:"器",t:"m",a:"water",atk:1200,f:"二つの器が重なり合う、淡い色の住宅。"},
 {n:"10の暮らし",g:"十",t:"m",a:"water",atk:1500,f:"「10の暮らし、10のレベル」。世帯ごとに色を分けた集合住宅。"},
 {n:"水冠の塔",g:"灯",t:"m",a:"water",atk:1700,f:"「水冠の塔と灯守の家」。自作スケッチから生まれた塔。"},
 {n:"幾何学的滝行建築",g:"滝",t:"m",a:"water",atk:2400,star:1,f:"滝行の姿を幾何学に抽象化した瞑想施設。"},
 {n:"素御",g:"素",t:"m",a:"wind",atk:1100,f:"自分で作り、運用している対話型の Web アプリ。"},
 {n:"斜めの家",g:"斜",t:"m",a:"wind",atk:1300,f:"車椅子でも過ごせる、段々畑の平屋。"},
 {n:"森の情景",g:"森",t:"m",a:"wind",atk:1600,f:"秋葉原の建築計画「アキバ・クリエイティブ・パーク」。"},
 {n:"ボロメオの寝所",g:"環",t:"m",a:"wind",atk:2200,star:1,f:"自由率俳句 13 句を精神分析で読み解いて設計した建築。"},
 {n:"二条城 本丸",g:"城",t:"m",a:"wind",atk:2800,star:1,f:"かつて現場監督として立った、本丸の現場。"},
 {n:"自由率俳句",g:"句",t:"s",e:"arrow",d:"相手の命を 800 減らす。",f:"自分が考案した俳句の形式。"},
 {n:"祈りの手",g:"祈",t:"s",e:"heal",d:"自分の命を 1000 ふやす。",f:"自分の手の形「祈り」をアイコンにした建築から。"},
 {n:"豆腐の角",g:"豆",t:"s",e:"bolt",d:"相手の場でいちばん強い作品を倒す。",f:"小説「恋路を邪魔する奴は豆腐の角に頭をぶつけて死ねないでいろ」から。"},
 {n:"AIは筆",g:"筆",t:"s",e:"buff",d:"自分の場でいちばん強い作品の攻撃力を +500（ずっと）。",f:"創作の信条。AI は道具であり、筆である。"},
 {n:"志向縁占い",g:"占",t:"s",e:"draw",d:"山札から 2 枚引く。",f:"志向縁の考え方をもとにした占い。"},
 {n:"城の図面",g:"図",t:"t",e:"pit",d:"相手が攻撃力 1500 以上の作品を出したら、その作品を倒す。",f:"自作小説「城の図面」。図面はすべてを見抜く。"},
 {n:"ネットリテラシー",g:"網",t:"t",e:"mirror",d:"相手の作品が攻撃してきたら、その作品を倒す。",f:"詩「ネットリテラシー」から。"},
 {n:"一本の傘",g:"傘",t:"t",e:"guard",d:"相手の作品が攻撃してきたら、その攻撃を止める（だれも倒れない）。",f:"委託された映画脚本の傘から。"},
 {n:"ふたつの窓",g:"窓",t:"t",e:"guard",d:"相手の作品が攻撃してきたら、その攻撃を止める（だれも倒れない）。",f:"同じ言葉を、違う窓から見るゲーム。"},
 {n:"干された町",g:"干",t:"t",e:"revenge",d:"自分の作品が戦いで倒されたら、相手の命を 1000 減らす。",f:"町を歩いて撮った写真の動画から。"},
 {n:"ワケル",g:"分",t:"t",e:"counter",d:"相手が言葉の札を使ったら、それを打ち消す（効かなくなる）。",f:"自作の文字起こしアプリ。言葉を聞き分ける。"},
 {n:"街の幾何学",g:"街",t:"t",e:"mirror",d:"相手の作品が攻撃してきたら、その作品を倒す。",f:"概念象形アートの作品。"},
 // ---- cards earned by answering questions (index 26-45), stronger the more you solve ----
 // R
 {n:"箱をずらした家",g:"箱",t:"m",a:"fire",atk:1700,blast:500,rare:"R",f:"三つの正方形の箱を、斜めにずらして重ねた住宅。"},
 {n:"英会話ラボ",g:"声",t:"s",e:"draw",v:3,d:"山札から 3 枚引く。",rare:"R",f:"声だけで練習する AI 英会話アプリ。"},
 {n:"路地の洗濯物",g:"布",t:"m",a:"wind",atk:1500,double:1,rare:"R",f:"町を歩いて撮った写真に、哲学的な語りをつけた動画から。"},
 {n:"ここに在る館",g:"在",t:"m",a:"fire",atk:1900,rare:"R",f:"「I AM HERE」の絵から設計した建築。House of Hereness。"},
 {n:"円錐台の集合住宅",g:"錐",t:"m",a:"water",atk:1900,rare:"R",f:"反った曲面プレートの外皮をまとう集合住宅。"},
 {n:"気分の便り",g:"便",t:"s",e:"heal",v:2000,d:"自分の命を 2000 ふやす。",rare:"R",f:"表情から気分を読み取り、文章にして大切な人に伝えるアプリの構想。"},
 // SR
 {n:"温室のサナトリウム",g:"温",t:"m",a:"water",atk:2100,rare:"SR",f:"食堂、ガラスの渡り廊下、球体の温室、扇形の居室をもつ施設。"},

function ai(s,me){

  if(s.lp[me]<5000&&(id=find("heal")))return ["P",id];
  const myBest=strongest(s,me),opBest=strongest(s,o);
  if((id=find("bolt"))&&opBest>=0&&(myBest<0||s.mon[o][opBest].atk>=s.mon[me][myBest].atk))return ["P",id];
  if(!s.summoned){
    const ms=H.filter(h=>card(s,h).t==="m"&&ok(["S",h])).sort((a,b)=>card(s,b).atk-card(s,a).atk);
    const pick=ms.find(h=>!card(s,h).star||card(s,h).atk>s.mon[me][weakest(s,me)].atk+600);
    if(pick)return ["S",pick];
  }

  if((id=find("expose"))&&s.trap[o].some(Boolean))return ["P",id];
  if((id=find("buffall"))&&s.mon[me].filter(Boolean).length>=2)return ["P",id];
  if((id=find("arrow")))return ["P",id];
  const tr=H.find(h=>card(s,h).t==="t");if(tr&&ok(["T",tr]))return ["T",tr];
  if(s.turn>1){
    const order=s.mon[me].map((m,i)=>m&&!m.done?i:-1).filter(i=>i>=0).sort((a,b)=>s.mon[me][b].atk-s.mon[me][a].atk);
    for(const i of order){
      if(!hasMon(s,o))return ["A",i,-1];

      s.mon[o].forEach((d,j)=>{if(!d)return;const [ea,ed]=eff(s,me,i,o,j);if(ea>ed&&ed>bv){bv=ed;best=j}});

function onTap(d){

      if(el){el.animate([{transform:"rotateY(180deg) scale(.3)",opacity:0,filter:"brightness(3)"},{transform:"rotateY(0) scale(1.15)",opacity:1,offset:.7},{transform:"none",filter:"none"}],{duration:RM?1:800,easing:"cubic-bezier(.2,.9,.3,1)"});
        setTimeout(()=>{const p=ctr(el);ring(p.x,p.y,css("--gold"),8,8);burst(p.x,p.y,css("--gold"),90,10);burst(p.x,p.y,COL(CARDS[reward].a||"trap"),50,7)},RM?0:520)}
      else{const bar=app.querySelector(".qprog");if(bar){const p=ctr(bar);burst(p.x,p.y,css("--gold"),30,5)}}
    }else{quizState.picked.add(k);quizState.result="ng";quizScreen();const panel=app.querySelector(".panel");if(panel&&!RM)panel.animate([{transform:"translateX(-10px)"},{transform:"translateX(10px)"},{transform:"translateX(-6px)"},{transform:"none"}],{duration:300})}
  }));
  if($("qAdd"))$("qAdd").addEventListener("click",()=>{const d=myDeck();if(d.length<DMAX){save.deck=[...d,quizState.reward];persist()}quizScreen()});
  if($("qNext"))$("qNext").addEventListener("click",()=>{quizState=null;quizScreen()});
  if($("qSkip"))$("qSkip").addEventListener("click",()=>{const j=nextQ(i);quizState={i:j,picked:new Set(),result:null,reward:null,order:j<0?[]:shuffle([1,2,3,4],Math.random)};quizScreen()});

/* ================= effects ================= */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],rings=[],looping=false;
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";cx.setTransform(d,0,0,d,0,0)}
fit();addEventListener("resize",fit);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL=a=>css(a==="fire"?"--fire":a==="water"?"--water":a==="wind"?"--wind":a==="trap"?"--trap":"--gold");
function loop(){
  if(looping)return;looping=true;
  const tick=()=>{
    cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life>0);rings=rings.filter(r=>r.life>0);
    for(const p of parts){p.life--;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.98;p.rot+=p.vr;
      cx.globalAlpha=Math.max(0,p.life/p.max);cx.fillStyle=p.col;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      if(p.sq)cx.fillRect(-p.size/2,-p.size*.7,p.size,p.size*1.4);else{cx.beginPath();cx.arc(0,0,p.size,0,7);cx.fill()}cx.restore()}
    for(const r of rings){r.life--;r.r+=r.v;cx.globalAlpha=Math.max(0,r.life/r.max);cx.strokeStyle=r.col;cx.lineWidth=r.w*(r.life/r.max)+1;cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.stroke()}
    cx.globalAlpha=1;
    if(parts.length||rings.length)requestAnimationFrame(tick);else{looping=false;cx.clearRect(0,0,innerWidth,innerHeight)}
  };requestAnimationFrame(tick);
}
function burst(x,y,col,n=40,pw=7){if(RM)n=Math.min(n,8);for(let i=0;i<n;i++){const a=Math.random()*6.283,v=pw*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.12,life:40+Math.random()*25,max:65,col,size:2+Math.random()*3,rot:0,vr:0})}loop()}
function ring(x,y,col,v=6,w=6){rings.push({x,y,r:8,v,w,life:34,max:34,col});loop()}
function shards(r,col){const n=RM?8:46,wc=css("--washi");for(let i=0;i<n;i++){const x=r.left+Math.random()*r.width,y=r.top+Math.random()*r.height,mx=r.left+r.width/2,my2=r.top+r.height/2;
  parts.push({x,y,vx:(x-mx)*.12+(Math.random()-.5)*4,vy:(y-my2)*.1-3-Math.random()*4,g:.35,life:55+Math.random()*20,max:75,col:Math.random()<.5?col:wc,size:5+Math.random()*8,rot:Math.random()*6,vr:(Math.random()-.5)*.4,sq:1})}loop()}
const sleep=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,250):ms));
const Z=q=>document.querySelector(`[data-z="${q}"]`);
const LPel=sd=>document.querySelector(`[data-lp="${sd}"]`);
const ctr=el=>{const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,r}};
function shake(px){const st=document.getElementById("stage");if(!st||RM)return;const k=[];for(let i=0;i<7;i++)k.push({transform:`translate(${(Math.random()-.5)*px*2}px,${(Math.random()-.5)*px*2}px)`});k.push({transform:"none"});st.animate(k,{duration:380,easing:"ease-out"})}
function flash(col,a=.45){const d=document.createElement("div");d.className="flash";d.style.background=col;document.body.appendChild(d);d.animate([{opacity:a},{opacity:0}],{duration:420,easing:"ease-out"}).onfinish=()=>d.remove()}
async function banner(m,s,colVar="--gold",hold=650){
  const d=document.createElement("div");d.className="banner";d.style.setProperty("--bc",`var(${colVar})`);d.innerHTML=`<div class="m">${esc(m)}</div>${s?`<div class="s">${esc(s)}</div>`:""}`;document.body.appendChild(d);
  d.animate([{transform:"scaleY(0)",opacity:0},{transform:"scaleY(1.15)",opacity:1,offset:.6},{transform:"scaleY(1)",opacity:1}],{duration:RM?1:280,easing:"ease-out"});
  d.querySelector(".m").animate([{letterSpacing:".6em",opacity:0},{letterSpacing:".14em",opacity:1}],{duration:RM?1:420,easing:"cubic-bezier(.2,.8,.2,1)"});
  await sleep(280+hold);
  await new Promise(r=>{const a=d.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateX(40px)"}],{duration:RM?1:220});a.onfinish=r});d.remove();
}
function float(el,text,colVar,size=40){
  if(!el)return;const {x,y}=ctr(el),d=document.createElement("div");d.className="float";d.textContent=text;d.style.color=`var(${colVar})`;d.style.fontSize=size+"px";d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);
  d.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:0},{transform:"translate(-50%,-90%) scale(1.25)",opacity:1,offset:.2},{transform:"translate(-50%,-160%) scale(1)",opacity:0}],{duration:1100,easing:"ease-out"}).onfinish=()=>d.remove();
}
function countLP(sd,from,to){const el=LPel(sd);if(!el)return;const n=el.querySelector(".num");const t0=performance.now(),D=RM?1:650;
  const step=t=>{const k=Math.min(1,(t-t0)/D),v=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));n.textContent=Math.max(0,v);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);
  el.animate([{transform:"scale(1.4)"},{transform:"none"}],{duration:700})}
function evText(ev,prev){
  const X=NM(ev.side),s=ev.s,cn=id=>"「"+card(s,id).n+"」";
  switch(ev.k){
    case "turn":return {t:`第${s.turn}ターン：${X}の番`,c:"h"};
    case "summon":return {t:`${X}が${cn(ev.id)}を出した`};
    case "tribute":return {t:`${X}が${cn(ev.id)}を生け贄にした`};
    case "set":return {t:ev.side===my?`あなたが罠${cn(ev.id)}を伏せた（${TRIG[card(s,ev.id).e]}発動）`:`${X}が罠を 1 枚伏せた`};
    case "spell":return {t:`${X}が言葉${cn(ev.id)}を使った：${card(s,ev.id).d}`};
    case "trap":return {t:`${X}の罠${cn(ev.id)}が発動：${card(s,ev.id).d}`,c:"tr"};
    case "attack":{const a=prev.mon[ev.side][ev.from];const an=a?cn(a.id):"作品";
      if(ev.to<0)return {t:`${X}の${an}がダイレクトアタック`};const d=prev.mon[opp(ev.side)][ev.to];return {t:`${X}の${an}が${d?cn(d.id):"作品"}を攻撃`}}
    case "clash":{const ca=card(s,ev.ia),cd=card(s,ev.id2);
      const ba=ev.ea>ev.ba?`${ev.ba}＋相性500`:`${ev.ba}`,bd=ev.ed>ev.bd?`${ev.bd}＋相性500`:`${ev.bd}`;
      const r=ev.ea>ev.ed?`${ev.ea-ev.ed} の差で${X}の勝ち`:ev.ea<ev.ed?`${ev.ed-ev.ea} の差で${X}の負け`:"同じ数なので相打ち";
      return {t:`戦い：「${ca.n}」${ba}＝${ev.ea} 対 「${cd.n}」${bd}＝${ev.ed} → ${r}`,c:"b"}}
    case "destroy":return {t:`${NM(ev.side)}の${cn(ev.id)}が倒れた`};
    case "damage":return {t:`${NM(ev.side)}の命が ${ev.amt} 減った（残り ${Math.max(0,s.lp[ev.side])}）`,c:"d"};
    case "heal":return {t:`${X}の命が ${ev.amt} ふえた`};
    case "buff":return {t:`${X}の作品の攻撃力が 500 上がった`};
    case "negate":return {t:ev.what==="spell"?"言葉は罠で打ち消された":"攻撃は罠で止められた"};
    case "fizzle":return {t:"効く相手がいなかった"};
    case "trapbreak":return {t:`${NM(ev.side)}の伏せていた罠${cn(ev.id)}が壊された`,c:"tr"};
    case "buffall":return {t:`${X}の場の作品すべての攻撃力が ${ev.amt||300} 上がった`};
    case "draw":return ev.why==="direct"?{t:`${NM(ev.side)}はダイレクトアタックを受けたので 1 枚引いた`}:null;
    case "surrender":return {t:`${X}が降参した`,c:"d"};
    case "over":return {t:ev.win==="draw"?"引き分け":`${NM(ev.win)}の勝ち`,c:"h"};
  }
  return null;
}
async function fx(ev){
  const prev=shown,s=ev.s,sd=ev.side;
  {const l=evText(ev,prev);if(l){logLines.push(l);if(logLines.length>60)logLines.shift()}}
  switch(ev.k){
    case "turn": render(s);await banner(sd===my?"あなたのターン":NM(sd)+"のターン",`第${s.turn}ターン`,sd===my?"--gold":"--bad",550);break;
    case "draw":{if(ev.why==="direct")await banner(`${NM(sd)}が 1 枚引く`,"ダイレクトアタックを受けたので","--wind",500);render(s);if(sd===my){const cs=[...document.querySelectorAll(".hand .zone")].slice(-ev.n);
      cs.forEach((c,i)=>c.animate([{transform:"translate(160px,-60px) rotate(25deg)",opacity:0},{transform:"none",opacity:1}],{duration:RM?1:420,delay:i*140,easing:"cubic-bezier(.2,.9,.3,1)",fill:"backwards"}));await sleep(420+ev.n*140)}else await sleep(200);break}
    case "tribute":{render(prev);const el=Z(`${sd}m${ev.slot}`);if(el){const {r}=ctr(el);shards(r,css("--gold"));float(el,"生け贄","--gold",26);el.animate([{opacity:1},{opacity:0,transform:"scale(.4) rotate(12deg)"}],{duration:RM?1:380,fill:"forwards"})}
      await sleep(420);render(s);break}
    case "summon":{const c=card(s,ev.id);
      if(ev.star)await banner("上級召喚",c.n,c.a==="fire"?"--fire":c.a==="water"?"--water":"--wind",350);
      render(s);const el=Z(`${sd}m${ev.slot}`);
      if(el){el.style.zIndex=5;el.animate([{transform:"translateY(-90px) scale(2.1) rotate(-10deg)",opacity:0,filter:"brightness(3)"},{transform:"scale(.92)",opacity:1,filter:"brightness(1.4)",offset:.7},{transform:"none",filter:"none"}],{duration:RM?1:520,easing:"cubic-bezier(.3,1.3,.5,1)"});
        await sleep(360);const p=ctr(el);ring(p.x,p.y,COL(c.a),ev.star?9:6,ev.star?10:6);burst(p.x,p.y,COL(c.a),ev.star?90:45,ev.star?10:7);shake(ev.star?14:6);if(ev.star)flash(COL(c.a),.35);el.style.zIndex="";float(el,"召喚","--ink",24)}
      await sleep(380);break}
    case "set":{render(s);const el=Z(`${sd}t${ev.slot}`);if(el){el.animate([{transform:"translateY(50px) rotateX(80deg)",opacity:0},{transform:"none",opacity:1}],{duration:RM?1:420,easing:"ease-out"});const p=ctr(el);ring(p.x,p.y,COL("trap"),4,3)}
      await sleep(480);break}
    case "spell":{const c=card(s,ev.id);render(s);await banner("言葉　"+c.n,c.d,"--gold",500);break}
    case "fizzle":await banner("不発","効く相手がいませんでした","--mute",300);break;
    case "heal":{render(s);const el=LPel(sd);if(el){const p=ctr(el);burst(p.x,p.y,css("--wind"),40,4);float(el,"+"+ev.amt,"--wind")}countLP(sd,prev.lp[sd],s.lp[sd]);await sleep(700);break}
    case "trapbreak":{render(prev);const el=Z(`${sd}t${ev.slot}`);if(el){const {r}=ctr(el);shards(r,COL("trap"));el.animate([{opacity:1},{opacity:0,transform:"scale(.3) rotate(-20deg)"}],{duration:RM?1:420,fill:"forwards"});float(el,"罠を破壊","--trap",24)}await sleep(500);render(s);break}
    case "buffall":{render(s);document.querySelectorAll(`[data-z^="${sd}m"]`).forEach(el=>{if(!el.querySelector(".card"))return;el.animate([{transform:"scale(1.2)",filter:"brightness(1.8)"},{transform:"none",filter:"none"}],{duration:600});const p=ctr(el);ring(p.x,p.y,css("--gold"),5,5);float(el,"+"+(ev.amt||300),"--gold",26)});await sleep(700);break}
    case "buff":{render(s);const el=Z(`${sd}m${ev.slot}`);if(el){el.animate([{transform:"scale(1.25)",filter:"brightness(1.8)"},{transform:"none",filter:"none"}],{duration:600});const p=ctr(el);ring(p.x,p.y,css("--gold"),5,5);float(el,"+500","--gold",30)}await sleep(650);break}
    case "trap":{render(prev);const el=Z(`${sd}t${ev.slot}`),c=card(s,ev.id);
      if(el){el.style.zIndex=6;el.animate([{transform:"rotateY(0)"},{transform:"rotateY(90deg) scale(1.6)"},{transform:"rotateY(0) scale(1)"}],{duration:RM?1:380});const p=ctr(el);ring(p.x,p.y,COL("trap"),10,10)}
      flash(COL("trap"),.5);shake(10);await banner(`${NM(sd)}の罠発動！`,"「"+c.n+"」\n"+c.d,"--trap",1300);render(s);break}
    case "attack":{render(prev);const a=Z(`${sd}m${ev.from}`),t=ev.to>=0?Z(`${opp(sd)}m${ev.to}`):LPel(opp(sd));
      if(ev.to<0)await banner("ダイレクトアタック",card(prev,prev.mon[sd][ev.from].id).n,"--bad",250);
      if(a&&t){const A=ctr(a),T=ctr(t),dx=T.x-A.x,dy=T.y-A.y;a.style.zIndex=8;
        a.animate([{transform:"none"},{transform:`translate(${-dx*.08}px,${-dy*.08}px) scale(1.05)`,offset:.25},{transform:`translate(${dx*.82}px,${dy*.82}px) scale(1.2) rotate(${dx>0?6:-6}deg)`,offset:.55},{transform:"none"}],{duration:RM?1:640,easing:"cubic-bezier(.5,0,.3,1)"});
        await sleep(350);ring(T.x,T.y,css("--ink"),8,8);burst(T.x,T.y,css("--bad"),55,9);shake(12);await sleep(320);a.style.zIndex=""}
      break}
    case "negate":{render(s);await banner(ev.what==="spell"?"言葉は打ち消された":"攻撃は止められた","","--trap",450);break}
    case "clash":{render(prev);const a=Z(`${sd}m${ev.from}`),t=Z(`${opp(sd)}m${ev.to}`);float(a,String(ev.ea),ev.ea>=ev.ed?"--gold":"--mute",32);float(t,String(ev.ed),ev.ed>=ev.ea?"--gold":"--mute",32);
      const ca=card(s,ev.ia),cd=card(s,ev.id2),A=NM(sd),D=NM(opp(sd));
      const la=`${A}「${ca.n}」 ${ev.ba}${ev.ea>ev.ba?` ＋500（${ATTR[ca.a]}は${ATTR[cd.a]}に強い）`:""} ＝ ${ev.ea}`;
      const ld=`${D}「${cd.n}」 ${ev.bd}${ev.ed>ev.bd?` ＋500（${ATTR[cd.a]}は${ATTR[ca.a]}に強い）`:""} ＝ ${ev.ed}`;
      const res=ev.ea>ev.ed?`${ev.ea-ev.ed} の差で「${cd.n}」が倒れる`:ev.ea<ev.ed?`${ev.ed-ev.ea} の差で「${ca.n}」が倒れる`:"同じ数なので両方倒れる";
      await banner(res,la+"\n"+ld,ev.ea===ev.ed?"--mute":((ev.ea>ev.ed)===(sd===my))?"--gold":"--bad",1500);break}
    case "destroy":{render(prev);const el=Z(`${sd}m${ev.slot}`),c=card(prev,ev.id);
      if(el){const {r}=ctr(el);shards(r,COL(c.a));el.animate([{transform:"none",opacity:1,filter:"none"},{transform:"scale(1.15)",filter:"brightness(2.5)",offset:.2},{transform:"scale(.3) rotate(25deg)",opacity:0}],{duration:RM?1:480,fill:"forwards"});float(el,"撃破","--bad",28)}
      shake(8);await sleep(520);render(s);break}
    case "damage":{render(s);const el=LPel(sd);countLP(sd,prev.lp[sd],s.lp[sd]);float(el,"-"+ev.amt,"--bad",ev.amt>=2000?56:44);
      if(el){const p=ctr(el);burst(p.x,p.y,css("--bad"),Math.min(90,20+ev.amt/40),8)}
      shake(Math.min(20,4+ev.amt/150));if(sd===my)flash(css("--bad"),Math.min(.5,.15+ev.amt/8000));await sleep(800);break}
    case "surrender":{render(s);flash(css("--mute"),.3);await banner(`${NM(sd)}が降参`,"勝負はここまで","--mute",900);break}
    case "over":{render(s);
      if(ev.win===my){for(let i=0;i<5;i++)setTimeout(()=>burst(innerWidth/2+(Math.random()-.5)*220,innerHeight*.4+(Math.random()-.5)*140,COL(["fire","water","wind","gold","trap"][i]),70,10),i*170)}
      await banner(ev.win==="draw"?"引き分け":ev.win===my?"勝利":"敗北","",ev.win===my?"--gold":"--bad",1100);break}
    default: render(s);
  }
}
